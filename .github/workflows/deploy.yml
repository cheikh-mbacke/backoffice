name: Deploy Backoffice to Production

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: cheikh-mbacke/backoffice

jobs:
    build:
        name: Build Backoffice Docker Image
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

        outputs:
            image-tag: ${{ steps.meta.outputs.tags }}
            image-digest: ${{ steps.build.outputs.digest }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Docker image
              id: build
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64

    deploy:
        name: Deploy Backoffice to Production
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

        environment:
            name: production
            url: https://backoffice.consignespro.com

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup SSH key
              uses: webfactory/ssh-agent@v0.8.0
              with:
                  ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

            - name: Add server to known hosts
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

            - name: Create deployment directory on server
              run: |
                  ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
                    mkdir -p /opt/hotel-shift-backoffice
                    cd /opt/hotel-shift-backoffice
                  "

            - name: Copy deployment files to server
              run: |
                  scp ./docker-compose.prod.yml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/hotel-shift-backoffice/

            - name: Update production compose with correct image
              run: |
                  ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
                    cd /opt/hotel-shift-backoffice
                    IMAGE_TAG='${{ needs.build.outputs.image-tag }}'
                    CLEAN_TAG=\$(echo \"\$IMAGE_TAG\" | head -n1 | tr -d '\\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                    echo \"Tag nettoyé: '\$CLEAN_TAG'\"
                    sed -i 's#ghcr.io/cheikh-mbacke/backoffice:.*#'\"\$CLEAN_TAG\"'#g' docker-compose.prod.yml
                    echo \"Image mise à jour: \$CLEAN_TAG\"
                  "

            - name: Verify image tag update
              run: |
                  ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
                    cd /opt/hotel-shift-backoffice
                    echo 'Contenu du docker-compose après modification:'
                    grep 'image:' docker-compose.prod.yml
                  "

            - name: Login to GitHub Container Registry on server
              run: |
                  ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
                    echo '${{ secrets.DOCKER_REGISTRY_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
                  "

            - name: Deploy backoffice application
              run: |
                  ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
                    cd /opt/hotel-shift-backoffice
                    
                    # Arrêter les services existants
                    docker compose -f docker-compose.prod.yml down || true
                    
                    # Arrêter tout conteneur utilisant le port 8082
                    docker ps --filter 'publish=8082' --format '{{.ID}}' | xargs -r docker stop || true
                    
                    # Supprimer l'ancienne image
                    IMAGE_TAG='${{ needs.build.outputs.image-tag }}'
                    CLEAN_TAG=\$(echo \"\$IMAGE_TAG\" | head -n1 | tr -d '\\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                    docker image rm \$CLEAN_TAG || true
                    
                    # Pull la nouvelle image
                    docker compose -f docker-compose.prod.yml pull backoffice
                    
                    # Redémarrer les services
                    docker compose -f docker-compose.prod.yml up -d
                    
                    # Attendre que les services soient prêts
                    echo 'Attente du démarrage des services...'
                    sleep 15
                    
                    # Vérifier le statut
                    docker compose -f docker-compose.prod.yml ps
                  "

            - name: Note about Nginx configuration
              run: |
                  echo "ℹ️  Nginx est géré manuellement sur le serveur hôte."
                  echo "ℹ️  Assurez-vous que votre configuration Nginx pointe vers http://127.0.0.1:8082"

            - name: Basic deployment verification
              run: |
                  ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
                    cd /opt/hotel-shift-backoffice
                    
                    echo '=== Statut des conteneurs ==='
                    docker compose -f docker-compose.prod.yml ps
                    
                    echo '=== Logs du conteneur backoffice ==='
                    docker compose -f docker-compose.prod.yml logs backoffice --tail 100
                    
                    echo '=== Vérification des images ==='
                    docker images | grep backoffice
                    
                    echo '=== Test de connectivité ==='
                    if curl -s --max-time 5 http://localhost:8082 >/dev/null; then
                      echo 'Backoffice accessible sur localhost:8082'
                    else
                      echo 'Backoffice non accessible sur localhost:8082'
                    fi
                    
                    # Vérifier que le conteneur backoffice est running
                    if docker compose -f docker-compose.prod.yml ps backoffice | grep -q 'Up'; then
                      echo 'Conteneur backoffice démarré'
                      
                      # Attente supplémentaire pour initialisation complète
                      echo 'Attente initialisation complète...'
                      sleep 10
                      
                      # Test basique de connectivité
                      if curl -s --max-time 10 http://localhost:8082 >/dev/null; then
                        echo 'Déploiement réussi - Backoffice accessible'
                      else
                        echo 'Déploiement réussi - Backoffice en cours d initialisation'
                      fi
                    else
                      echo 'Erreur: conteneur backoffice non démarré'
                      exit 1
                    fi
                  "

            - name: Final status report
              if: always()
              run: |
                  if [ "${{ job.status }}" == "success" ]; then
                    echo "Déploiement backoffice réussi"
                    echo "Application accessible: https://backoffice.consignespro.com"
                    echo "API accessible: https://api.consignespro.com"
                  else
                    echo "Déploiement backoffice échoué"
                    echo "Vérification manuelle requise"
                  fi
